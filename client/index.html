<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      題名。ブラウザのタブ・お気に入り・ホーム画面に追加したときの名前になる。
      ホーム画面の名前は manifest.webmanifest の short_name が優先される。
    -->
    <title>価格改定進捗管理アプリ</title>
    <meta name="description" content="値上げ交渉の進捗管理（株式会社パロマ 営業本部）" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#dc000c" />
    <meta name="apple-mobile-web-app-title" content="価格改定進捗" />
    <!--
      書体はポータル（pf-portal）と同じ Noto Sans JP。PFシリーズのアプリを
      行き来しても字面が変わらないようにする。読み込めない場合は
      index.css の指定でOS標準の書体へ落ちるため、表示が止まることはない。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
