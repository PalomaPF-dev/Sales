<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" role="img" aria-label="価格交渉管理">
  <!--
    価格交渉管理アプリのしるし。
    パロマレッドの角丸に、値上げを表す「¥と右上がりの矢印」を置く。
    ほかのPFアプリと同じ形（角丸の四角＋白い記号）にそろえている。
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8121e"/>
      <stop offset="1" stop-color="#b30009"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#g)"/>
  <g fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <!-- 右上がりの矢印（値上げ） -->
    <path d="M104 112l26-30 20 18 22-32"/>
    <path d="M152 68h20v20"/>
    <!-- ¥ -->
    <path d="M40 62l24 32 24-32"/>
    <path d="M42 104h44"/>
    <path d="M42 124h44"/>
    <path d="M64 94v46"/>
  </g>
</svg>
